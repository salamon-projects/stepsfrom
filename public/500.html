<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Something went wrong · Beachfront World</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           background: linear-gradient(160deg, #0b3954 0%, #155e75 60%, #176d73 100%); color: #ffffff;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.55; }
    main { max-width: 32rem; }
    .code { margin: 0; color: #d8eef2; font-weight: 700; letter-spacing: 0.08em; }
    h1 { margin: 0.25rem 0 0.75rem; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.2; }
    p { margin: 0 0 1.5rem; color: #e6f3f6; font-size: 1.1rem; }
    a { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0.5rem 1.2rem; border-radius: 6px;
         background: #ffffff; color: #0b3954; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #d8eef2; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">500</p>
    <h1>Something went wrong on our side.</h1>
    <p>We have been notified. Please try again in a few minutes.</p>
    <a href="/">Go to Beachfront World</a>
  </main>
</body>
</html>
