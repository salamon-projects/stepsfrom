# Guide pages (/guides/:slug), one entry per guide, keyed by its slug. The
# ranked list and every figure come from the database; this file holds only
# the editorial copy. A guide is shown (and linked, and in the sitemap) only
# while its destination is published and has published properties.
#
#   destination:  slug of the destination whose stays are ranked
#   title:        <title> and og:title (unique; the target keyword early)
#   keyword:      the search phrase the guide is written for (not rendered)
#   description:  meta description
#   heading:      the H1
#   link_text:    how the destination and country pages link to the guide
#   limit:        how many stays to rank (default 15)
#   intro:        paragraphs
#   faq:          question/answer pairs (also FAQPage JSON-LD)
#
# Copy may use these placeholders, filled from the data (Guide#facts):
#   %{destination} %{country} %{sea}       names ("the Adriatic Sea", or "the sea")
#   %{listed}        "42 places to stay"   all published stays of the destination
#   %{direct} %{near} %{walkable}          how many of them have each badge
#   %{shown}         how many the guide ranks
#   %{closest_name} %{closest_m}           the stay nearest the water, its distance in m
#   %{closest}       "6 m from the water", or "right on the water" at 0 m
#   %{direct_max_m} %{direct_beach_max_m} %{beach_adjacent_m} %{near_max_m} %{walkable_max_m}
#                                          thresholds from config/waterfront.yml
# Keep the copy true to the "How we verify" page: the distance is a straight
# line to the shoreline, not a walking route, and booking sites' labels are
# never used to list a stay.

hvar-beachfront-hotels:
  destination: hvar
  title: "Hvar beachfront hotels, measured to the water"
  keyword: Hvar beachfront hotels
  description: "The best beachfront hotels in Hvar, ranked by measured distance to %{sea}: %{direct} verified beachfront with no road in between. The closest is %{closest}."
  heading: Best beachfront hotels in Hvar
  link_text: "Guide: the best beachfront hotels in Hvar"
  intro:
    - "On a booking site, “beachfront” can mean a room above the rocks or a walk down three streets and across the coast road. This guide uses measurements instead. For every hotel, apartment and guest house on Hvar we take its building outline from OpenStreetMap (or its position, where no outline is mapped) and measure the shortest straight line to the shoreline of %{sea}. If a road or railway crosses that line, the stay is not beachfront here, however close it is."
    - "A stay is marked Verified beachfront when nothing but beach or rocks lies between it and the water and the water is at most %{direct_max_m} m away, or up to %{direct_beach_max_m} m across a mapped beach that starts within %{beach_adjacent_m} m of it. Steps from the water means at most %{near_max_m} m, usually with a road or path in between; Short walk to the water means at most %{walkable_max_m} m. Anything further is left out, whatever a booking site calls it."
    - "We have measured %{listed} on Hvar that pass, %{direct} of them verified beachfront. Below are the %{shown} closest to the water: verified beachfront first, then by measured distance. The distance is a straight line, not a walking route, and no property pays to be listed or ranked."
  faq:
    - question: Which hotels in Hvar are really beachfront?
      answer: "Verified beachfront: %{direct} of the %{listed} we list on Hvar, with no road or railway between them and the water, and the water at most %{direct_max_m} m away (or %{direct_beach_max_m} m across a mapped beach that starts within %{beach_adjacent_m} m). Verified beachfront stays come first in the list above."
    - question: Which stay in Hvar is closest to the water?
      answer: "%{closest_name}: %{closest}, measured in a straight line from its building to the shoreline."
    - question: How do you measure the distance to the water?
      answer: "From OpenStreetMap data: the shortest straight line from the building outline (or its position) to the shoreline. It is not a walking route. Every stay is measured again whenever the map data is refreshed."
    - question: Why is a hotel that a booking site calls beachfront missing?
      answer: "We list only what our measurement supports. A stay more than %{walkable_max_m} m from the water is left out, and one with a road or railway in between cannot be verified beachfront, whatever the booking site says."

makarska-hotels-on-the-beach:
  destination: makarska-riviera
  title: "Makarska hotels on the beach, measured not claimed"
  keyword: Makarska hotels on the beach
  description: "Makarska Riviera hotels on the beach, ranked by measured distance to %{sea}. %{direct} verified beachfront with no road in between; the closest is %{closest}."
  heading: "Makarska Riviera: hotels actually on the beach"
  link_text: "Guide: Makarska Riviera hotels actually on the beach"
  intro:
    - "Along the Makarska Riviera, plenty of hotels advertise the beach, but some of them sit on the far side of a coast road. This guide only uses measurements. We take each hotel’s, apartment’s and guest house’s building outline from OpenStreetMap (or its position, where no outline is mapped) and measure the shortest straight line to the shoreline of %{sea}. If a road or railway crosses that line, the stay does not count as on the beach, however close it is."
    - "Verified beachfront means nothing but beach or rocks in between and the water at most %{direct_max_m} m away, or up to %{direct_beach_max_m} m across a mapped beach that starts within %{beach_adjacent_m} m of the building. Steps from the water means at most %{near_max_m} m, usually across a road or promenade; Short walk to the water means at most %{walkable_max_m} m. Anything further is not listed."
    - "We have measured %{listed} on the Makarska Riviera that pass, %{direct} of them verified beachfront. Below are the %{shown} closest: verified beachfront first, then by measured distance. The distance is a straight line, not a walking route, and no property pays to be listed or ranked."
  faq:
    - question: Which Makarska hotels are really on the beach?
      answer: "Verified beachfront: %{direct} of the %{listed} we list on the Makarska Riviera, with no road or railway between them and the water, and the water at most %{direct_max_m} m away (or %{direct_beach_max_m} m across a mapped beach that starts within %{beach_adjacent_m} m). Verified beachfront stays come first in the list above."
    - question: Which stay on the Makarska Riviera is closest to the water?
      answer: "%{closest_name}: %{closest}, measured in a straight line from its building to the shoreline."
    - question: Does a promenade in front count against a hotel?
      answer: "No. A promenade or footpath between a stay and the beach is shown for information, but only a road or railway in between rules out verified beachfront."
    - question: How do you measure the distance to the water?
      answer: "From OpenStreetMap data: the shortest straight line from the building outline (or its position) to the shoreline. It is not a walking route. Every stay is measured again whenever the map data is refreshed."

ibiza-beachfront-hotels:
