      answer: "Not necessarily. Each stay shows the surface of the nearest mapped beach when OpenStreetMap records one; some of Ibiza's coast is rocky, and a stay can be verified beachfront on rocks."
    - question: Which stay in Ibiza is closest to the water?
      answer: "%{closest_name}: %{closest}, measured in a straight line from its building to the shoreline."
