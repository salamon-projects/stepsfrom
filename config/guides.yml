  intro:
    - "“Beachfront” in Ibiza can mean a terrace over the sand or a room above a road with a sea view. This guide uses measurements instead. For every hotel, apartment and guest house we take its building outline from OpenStreetMap (or its position, where no outline is mapped) and measure the shortest straight line to the shoreline of %{sea}. If a road or railway crosses that line, the stay is not beachfront here, however close it is."
